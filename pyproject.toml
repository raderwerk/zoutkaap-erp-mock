[project]
name = "zoutkaap-erp-mock"
version = "0.1.0"
description = "ERP-nabootsing van Zoutkaap als REST-service met OpenAPI-spec (producten, voorraad, orders)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "httpx2>=2.12",
    "openapi-spec-validator>=0.7",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
